model_list:
  # Desktop Ollama models
  - model_name: desktop-qwen2.5:1.5b
    litellm_params:
      model: openai/qwen2.5:1.5b
      litellm_credential_name: desktop_ollama

  # Anthropic models
  - model_name: claude-haiku-4-5
    litellm_params: &claude-haiku-4-5-params
      model: claude-haiku-4-5
      litellm_credential_name: anthropic
  - model_name: claude-sonnet-4-6
    litellm_params: &claude-sonnet-4-6-params
      model: claude-sonnet-4-6
      litellm_credential_name: anthropic
  
  # OpenAI models
  - model_name: gpt-5-nano
    litellm_params:
      model: gpt-5-nano
      litellm_credential_name: openai

  # Together.ai models
  - model_name: togetherai-gemma-4-31b-it
    litellm_params: &togetherai-gemma4-31b-it-params
      model: openai/google/gemma-4-31b-it
      litellm_credential_name: togetherai
  - model_name: togetherai-gpt-oss-20b
    litellm_params:
      model: openai/openai/gpt-oss-20b
      litellm_credential_name: togetherai
  - model_name: togetherai-qwen3.5-397b
    litellm_params: &togetherai-qwen3-5-397b
      model: openai/Qwen/Qwen3.5-397B-A17B
      litellm_credential_name: togetherai
  
  # Cerebras models
  - model_name: cerebras-llama3.1-8b
    litellm_params: &cerebras-llama3-1-8b-params
      model: openai/llama3.1-8b
      litellm_credential_name: cerebras
  
  # Vast.ai models (Ollama / vLLM)
  - model_name: vast-gemma4:26b
    litellm_params: &vast-gemma4-26b-params
      model: openai/gemma4:26b
      litellm_credential_name: vast_ai
  
  # Claude Code aliases
  - model_name: cc-high # Do not include names like 'opus' in model alias name, as it causes LiteLLM to treat them as a Responses API-supporting model
    litellm_params: *togetherai-qwen3-5-397b
  - model_name: cc-medium
    litellm_params: *togetherai-qwen3-5-397b
  - model_name: cc-low
    litellm_params: *togetherai-qwen3-5-397b
  
  # Agent model aliases
  - model_name: pentagi
    litellm_params: *togetherai-qwen3-5-397b
  - model_name: pentestgpt
    litellm_params: *togetherai-qwen3-5-397b
  - model_name: cybersecurity-ai
    litellm_params: *togetherai-qwen3-5-397b
  

credential_list:
  - credential_name: desktop_ollama
    credential_values:
      api_key: "sk-123" # not needed, Ollama
      api_base: "http://100.76.105.2:11434/v1"
    credential_info:
      description: "Desktop Ollama instance"
      custom_llm_provider: "openai_compatible"
  
  - credential_name: anthropic
    credential_values:
      api_key: "os.environ/ANTHROPIC_API_KEY"
    credential_info:
      description: "Anthropic API"
      custom_llm_provider: "anthropic"

  - credential_name: openai
    credential_values:
      api_key: "os.environ/OPENAI_API_KEY"
    credential_info:
      description: "OpenAI API"
      custom_llm_provider: "openai"
  
  - credential_name: togetherai
    credential_values:
      api_key: "os.environ/TOGETHERAI_API_KEY"
      api_base: "https://api.together.xyz/v1"
    credential_info:
      description: "Together.ai API"
      custom_llm_provider: "openai"
  
  - credential_name: cerebras
    credential_values:
      api_key: "os.environ/CEREBRAS_API_KEY"
      api_base: "https://api.cerebras.ai/v1"
    credential_info:
      description: "Cerebras API"
      custom_llm_provider: "openai"

  - credential_name: vast_ai
    credential_values:
      api_key: "os.environ/VAST_AI_KEY"
      api_base: "os.environ/VAST_AI_API_BASE"
    credential_info:
      description: "Vast.ai instances"
      custom_llm_provider: "openai_compatible"

# litellm_settings:
